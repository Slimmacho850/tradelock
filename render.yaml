services:
  # Static Web App (Free Hosting)
  - type: web
    name: mt5-lock-guardian-web
    env: static
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 24/7 Cloud Sentinel Daemon (Optional free background worker)
  - type: worker
    name: mt5-lock-guardian-sentinel
    env: node
    buildCommand: npm install
    startCommand: node backend/sentinel.js
    envVars:
      - key: META_API_TOKEN
        sync: false
      - key: META_API_ACCOUNT_ID
        sync: false
      - key: META_API_REGION
        value: new-york
      - key: DAILY_LOSS_LIMIT
        value: "200"
      - key: DAILY_PROFIT_TARGET
        value: "400"
      - key: MAX_TRAILING_DD
        value: "300"
      - key: MAX_DAILY_TRADES
        value: "6"
