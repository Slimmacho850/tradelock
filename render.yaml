services:
  # All-in-One 24/7 Cloud Sentinel & Mobile Web App
  - type: web
    name: mt5-risk-guardian
    env: node
    buildCommand: npm install && npm run build
    startCommand: node sentinel.js
    envVars:
      - key: META_API_TOKEN
        sync: false
      - key: META_API_ACCOUNT_ID
        sync: false
      - key: META_API_REGION
        value: new-york
      - key: DAILY_LOSS_LIMIT
        value: "200"
      - key: DAILY_PROFIT_TARGET
        value: "400"
      - key: MAX_TRAILING_DD
        value: "300"
      - key: MAX_DAILY_TRADES
        value: "6"
